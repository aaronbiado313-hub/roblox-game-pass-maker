<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Pass Maker - Pro Edition</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00d4ff, #00b06f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 1.1em;
        }

        .card {
            background: rgba(42, 42, 62, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.8s ease-out;
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
            color: #00d4ff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00b06f;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(30, 30, 46, 0.6);
            border: 1px solid rgba(0, 176, 111, 0.3);
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00b06f;
            background: rgba(30, 30, 46, 0.9);
            box-shadow: 0 0 20px rgba(0, 176, 111, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00b06f, #00d4ff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 176, 111, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 176, 111, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95em;
            animation: slideUp 0.4s ease-out;
        }

        .status.loading {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border-left: 4px solid #ffcc00;
        }

        .status.success {
            background: rgba(0, 176, 111, 0.2);
            color: #00ff9f;
            border-left: 4px solid #00b06f;
        }

        .status.error {
            background: rgba(255, 59, 48, 0.2);
            color: #ff6b6b;
            border-left: 4px solid #ff3b30;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 176, 111, 0.1);
            border: 1px solid rgba(0, 176, 111, 0.3);
            border-radius: 8px;
            animation: slideUp 0.4s ease-out;
        }

        .result-box p {
            margin-bottom: 12px;
            color: #e0e0e0;
        }

        .result-box strong {
            color: #00ff9f;
        }

        .result-box a {
            display: inline-block;
            margin-top: 10px;
            color: #00d4ff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .result-box a:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .profile-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b06f, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5em;
        }

        .logout-btn {
            width: auto;
            padding: 10px 20px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            margin-top: 0;
        }

        .logout-btn:hover {
            background: rgba(255, 59, 48, 0.3);
        }

        .history-section {
            margin-top: 30px;
        }

        .history-item {
            background: rgba(30, 30, 46, 0.6);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #00b06f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item-info h4 {
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .history-item-info p {
            color: #888;
            font-size: 0.9em;
        }

        .history-item-link {
            color: #00ff9f;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(0, 176, 111, 0.2);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .history-item-link:hover {
            background: rgba(0, 176, 111, 0.3);
        }

        .icon-preview {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            background: rgba(30, 30, 46, 0.6);
            border: 2px dashed rgba(0, 176, 111, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-preview:hover {
            border-color: rgba(0, 176, 111, 0.6);
            background: rgba(30, 30, 46, 0.9);
        }

        .icon-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .icon-preview.empty {
            color: #888;
            font-size: 2em;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 204, 0, 0.3);
            border-radius: 50%;
            border-top-color: #ffcc00;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: rgba(0, 176, 111, 0.2);
            border: 2px dashed rgba(0, 176, 111, 0.5);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #00b06f;
        }

        .file-input-label:hover {
            background: rgba(0, 176, 111, 0.3);
            border-color: rgba(0, 176, 111, 0.8);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .card {
                padding: 20px;
            }

            .profile-section {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
            }

            .history-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎮 Roblox Game Pass Maker</h1>
            <p>Create and manage your game passes effortlessly</p>
        </header>

        <!-- 1. Login Section -->
        <div class="card" id="login-section">
            <h2>Welcome</h2>
            <p style="margin-bottom: 20px; color: #aaa;">Sign in with your Roblox account to get started</p>
            <button onclick="robloxLogin()">🔐 Log in with Roblox</button>
        </div>

        <!-- 2. Main App Section (Hidden until logged in) -->
        <div id="app-section" class="hidden">
            <!-- Profile Section -->
            <div class="card">
                <div class="profile-section">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">R</div>
                        <div>
                            <h3 id="userName" style="color: #00d4ff;">Loading...</h3>
                            <p id="userSubtext" style="color: #888; font-size: 0.9em;">Ready to create</p>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                </div>
            </div>

            <!-- Creation Form -->
            <div class="card">
                <h2>✨ Create New Game Pass</h2>
                
                <div class="form-group">
                    <label for="name">Game Pass Name *</label>
                    <input type="text" id="name" placeholder="e.g., VIP Pass, Double XP, Premium Access" required>
                </div>

                <div class="form-group">
                    <label for="desc">Description</label>
                    <textarea id="desc" placeholder="Describe what this game pass offers to your players..."></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price (Robux) *</label>
                    <input type="number" id="price" placeholder="e.g., 99, 199, 499" min="5" step="1" required>
                </div>

                <div class="form-group">
                    <label>Game Pass Icon (PNG, JPG, up to 5MB)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="iconFile" accept="image/png,image/jpeg,image/jpg" onchange="previewIcon()">
                        <label for="iconFile" class="file-input-label" id="fileLabel">
                            📤 Click to upload or drag & drop
                        </label>
                    </div>
                    <div class="icon-preview empty" id="iconPreview">🖼️</div>
                </div>

                <button onclick="createGamePass()" id="createBtn">🚀 Create Game Pass</button>
                <div id="status"></div>

                <div id="result" class="hidden">
                    <div class="result-box">
                        <p><strong>✅ Success!</strong></p>
                        <p><strong>Game Pass ID:</strong> <span id="gpId"></span></p>
                        <p id="gpStats"></p>
                        <a id="gpLink" href="#" target="_blank">👉 View in Roblox Store</a>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div class="card history-section">
                <h2>📋 Recent Game Passes</h2>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
